<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Şampiyon Müzayedesi</title>
<style>
:root{--bg:#eef2f8;--p:#fff;--b:#c5d0e2;--g:#8a6200;--t:#14203a;--m:#5b6b86;--bl:#0a7fc2;--rd:#c4284a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1220;--p:#101c30;--b:#2a3a55;--g:#e8c872;--t:#e9eef7;--m:#8da0bd;--bl:#3bc3ff;--rd:#ff5c7a}}
:root[data-theme="dark"]{--bg:#0a1220;--p:#101c30;--b:#2a3a55;--g:#e8c872;--t:#e9eef7;--m:#8da0bd;--bl:#3bc3ff;--rd:#ff5c7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.w{max-width:1120px;margin:auto;padding:12px}
h1,h2,h3{margin:.2em 0;color:var(--g);font-family:Georgia,"Times New Roman",serif}
.p{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px}
.row{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:10px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:820px){.row,.two{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.card{border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--p);text-align:center;padding-bottom:4px}
.card.pk{cursor:pointer;border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.art{position:relative;height:84px;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 14%));color:#fff;font:700 28px Georgia,serif}
.tag{position:absolute;top:4px;right:4px;font:700 9px sans-serif;padding:2px 5px;border-radius:4px;font-style:normal;color:#fff}
.tag.M{background:#8a6200}.tag.N{background:#9b2240}
.card small,.slot small{display:block;color:var(--g);font-size:10px}
.slot{display:flex;gap:8px;align-items:center;border:1px dashed var(--b);border-radius:8px;padding:4px;margin:5px 0;min-height:46px}
.slot .art{width:38px;height:38px;font-size:14px;border-radius:6px;flex:none}
button,select{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--g);border-radius:6px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--g);color:var(--bg);font-weight:700}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.big{font:700 40px Georgia,serif}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.stats div{border:1px solid var(--b);border-radius:6px;padding:4px 6px;text-align:center;font-size:12px;color:var(--m)}
.stats b{display:block;font-size:18px;color:var(--t)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px;text-align:center;border-bottom:1px solid var(--b)}td:first-child,th:first-child{text-align:left}
th{color:var(--m);font-weight:600;font-size:11px}
.log{max-height:210px;overflow:auto;font-size:13px}.log div{padding:2px 0;border-bottom:1px solid var(--b)}
.log b{color:var(--g);margin-right:8px}
.you{color:var(--bl)}.bot{color:var(--rd)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.cards .p{border-color:var(--g)}.cards h3{font-size:12px;margin:0 0 4px;font-family:inherit}
@media(max-width:600px){.cards{grid-template-columns:1fr}}
</style></head>
<body><div class="w" id="app"></div>
<script>
const R={T:"ÜST KORİDOR",J:"ORMAN",M:"ORTA KORİDOR",B:"ALT KORİDOR",S:"DESTEK"},LN=Object.keys(R);
const META=["Master Yi","Yone","Kai’Sa","Aatrox"],NERF=["Rumble","Ryze"],N=["SEN","RAKİP"];
const C=("Kayle,T,40,80;Rumble,T,70,65;Gnar,T,65,60;Darius,T,75,60;Fiora,T,60,75;Garen,T,65,55;Ornn,T,55,70;Jax,T,60,78;Aatrox,T,72,68;"+
"Master Yi,J,55,80;Zac,J,60,65;Jarvan IV,J,70,60;Xin Zhao,J,72,55;Lee Sin,J,70,65;Vi,J,65,62;Kayn,J,60,78;Viego,J,64,72;Nidalee,J,75,50;"+
"Yone,M,62,76;Ryze,M,55,78;Cassiopeia,M,52,85;Aurora,M,66,64;Fizz,M,68,62;Ahri,M,66,66;Syndra,M,64,70;Zed,M,72,60;Viktor,M,52,80;Lux,M,60,64;"+
"Caitlyn,B,72,64;Lucian,B,74,58;Kalista,B,70,60;Jinx,B,50,85;Ezreal,B,62,68;Vayne,B,48,88;Kai’Sa,B,60,80;Miss Fortune,B,68,66;"+
"Leona,S,68,58;Nautilus,S,66,58;Janna,S,54,62;Thresh,S,64,64;Lulu,S,52,72;Blitzcrank,S,66,52;Soraka,S,48,66;Nami,S,56,64").split(";").map(s=>{
 const[n,r,e,l]=s.split(","),t=META.includes(n)?"M":NERF.includes(n)?"N":"",a=t=="M"?3:t=="N"?-3:0;
 return{n,r,e:+e+a,l:+l+a,t,h:[...n].reduce((x,y)=>x*31+y.charCodeAt(0),7)%360}});
const app=document.getElementById("app");let G;
const rnd=n=>Math.floor(Math.random()*n),fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const tile=c=>`<div class="art" style="--h:${c.h}">${c.n.slice(0,2)}${c.t?`<i class="tag ${c.t}">${c.t=="M"?"META":"NERF"}</i>`:""}</div>`;
const sc=c=>(c.e+c.l)/2;
const botVal=c=>sc(c)+(G.b.every(x=>x.r!=c.r)?10:0);
const cap=()=>G.my-(4-G.y.length)*10;

function newGame(){clearInterval(G&&G.timer);G={screen:"draft",y:[],b:[],my:1000,mb:1000,round:0,starter:"you",msg:""};nextRound()}
function pack(){const a=C.filter(c=>![...G.y,...G.b].includes(c));for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,10)}
function nextRound(){
 if(G.y.length==5&&G.b.length==5)return lanes();
 G.round++;G.pack=pack();G.bid=0;G.last=null;G.phase="bid";G.win=null;G.price=0;
 if(G.y.length==5){G.win="bot";G.phase="pick";G.msg="Takımın tamam, rakip ücretsiz seçiyor…";render();return setTimeout(botPick,1000)}
 if(G.b.length==5){G.win="you";G.phase="pick";G.msg="Rakip takımını tamamladı. Ücretsiz seçim senin.";return render()}
 const best=Math.max(...G.pack.map(botVal));
 G.bmax=Math.max(0,Math.min(G.mb-(4-G.b.length)*10,Math.round((best-45)*9*(.7+Math.random()*.6)/10)*10));
 G.turn=G.starter;G.starter=G.starter=="you"?"bot":"you";G.msg="";render();
 if(G.turn=="bot")setTimeout(botMove,800)}
function bid(n){if(G.turn!="you"||G.phase!="bid"||G.bid+n>cap())return;G.bid+=n;G.last="you";G.turn="bot";G.msg="";render();setTimeout(botMove,800)}
function botMove(){if(G.phase!="bid")return;
 if(G.bid+10<=G.bmax){G.bid=Math.min(G.bid+10*(1+rnd(3)),G.bmax);G.last="bot";G.turn="you";G.msg="Rakip teklifi artırdı.";render()}
 else end("you")}
function end(w){if(G.phase!="bid")return;G.win=w;G.price=Math.max(10,G.bid);G.phase="pick";
 if(w=="bot"){G.msg=`Rakip $${G.price} ile kazandı…`;render();setTimeout(botPick,1000)}
 else{G.msg=`Müzayedeyi $${G.price} ile kazandın. Paketten bir şampiyon seç.`;render()}}
function botPick(){pick(G.pack.reduce((a,c)=>botVal(c)>botVal(a)?c:a),"bot")}
function pk(i){if(G.phase=="pick"&&G.win=="you")pick(G.pack[i],"you")}
function pick(c,w){const price=G.price;
 if(w=="you"){G.y.push(c);G.my-=price}else{G.b.push(c);G.mb-=price}
 G.msg=`${w=="you"?"Sen":"Rakip"} ${c.n} aldı${price?` ($${price})`:""}.`;G.phase="done";render();setTimeout(nextRound,1500)}

function assign(l){const u=new Set(),o=l.map(c=>u.has(c.r)?null:(u.add(c.r),c.r));return o.map(r=>{if(r)return r;const x=LN.find(z=>!u.has(z));u.add(x);return x})}
function lanes(){G.screen="lanes";G.ly=assign(G.y);G.lb=assign(G.b);render()}
function setLane(i,v){G.ly[i]=v;render()}
function startSim(){if(new Set(G.ly).size<5)return;
 const U=(l,r)=>l.map((c,i)=>({c,lane:r[i],fit:c.r==r[i]?1:.8}));
 G.sim=simulate(U(G.y,G.ly),U(G.b,G.lb));G.screen="sim";G.fi=0;G.spd=450;play()}
function play(){clearInterval(G.timer);G.timer=setInterval(()=>{if(G.fi<G.sim.frames.length-1){G.fi++;render()}else clearInterval(G.timer)},G.spd)}
function faster(){G.spd=G.spd==450?130:450;play();render()}
function skip(){clearInterval(G.timer);G.fi=G.sim.frames.length-1;render()}
function analysis(){clearInterval(G.timer);G.screen="analysis";render()}

function simulate(A,B){
 const mk=u=>({u:u.map(x=>({...x,k:0,d:0,a:0,g:500,dmg:0})),kills:0,tw:0,dr:0,bar:0,inh:0,buff:0,gold:2500}),T=[mk(A),mk(B)];
 const frames=[],ev=[],dl=[];let t=0,win=null,nextDr=5,lastBar=-99,fb=false;
 const sec=()=>rnd(60),at=()=>(t-1)*60+sec(),add=(type,team,txt)=>ev.push({s:at(),type,team,txt});
 const str=i=>{const m=T[i];let s=0;m.u.forEach(x=>{s+=(x.c.e+(x.c.l-x.c.e)*Math.min(t,35)/35)*x.fit*(1+x.g/60000)});
  return s/5*(m.buff>0?1.12:1)*(1+Math.max(-.15,Math.min(.15,(m.kills-T[1-i].kills)*.006)))};
 const kill=(w,l)=>{const W=T[w],L=T[l],wt=W.u.map(x=>(x.lane=="B"||x.lane=="M"?1.4:1)*x.c.e*x.fit),tot=wt.reduce((a,b)=>a+b);
  let r=Math.random()*tot,ki=0;while(r>wt[ki]&&ki<4){r-=wt[ki];ki++}
  const k=W.u[ki],v=L.u[rnd(5)];k.k++;v.d++;k.g+=300;k.dmg+=1500+rnd(1500);W.kills++;W.gold+=300;
  W.u.forEach(x=>{if(x!=k&&Math.random()<.55){x.a++;x.g+=120;x.dmg+=500+rnd(900)}});
  dl.push({t,team:l});if(!fb){fb=true;add("fb",w,`${v.c.n}, ${k.c.n} tarafından düştü.`)}};
 while(win===null&&t<45){t++;
  T.forEach(m=>{m.gold+=1500;m.u.forEach(x=>x.g+=300);m.u.forEach(x=>x.dmg+=250+rnd(250))});
  if(Math.random()<.62){const s0=str(0)**3,s1=str(1)**3,w=Math.random()<s0/(s0+s1)?0:1,l=1-w;
   const kw=1+rnd(4),kl=rnd(Math.min(kw,2)+1);for(let i=0;i<kw;i++)kill(w,l);for(let i=0;i<kl;i++)kill(l,w);
   const W=T[w];
   if(t>=nextDr){W.dr++;nextDr=t+5;add("dr",w,`${N[w]}, EJDERHA aldı!`)}
   else if(t>=20&&t-lastBar>=7&&Math.random()<.5){W.bar++;W.buff=3;lastBar=t;add("bar",w,`${N[w]}, BARON aldı!`)}
   if(Math.random()<.7&&W.tw<11){W.tw++;add("tw",w,`${N[w]}, ${["ÜST","ORTA","ALT"][rnd(3)]} kulesini yıktı.`)}
   while(W.inh<Math.min(3,Math.floor(W.tw/3))){W.inh++;add("inh",w,`${N[w]}, ${["ORTA","ALT","ÜST"][W.inh-1]} inhibitörünü yıktı.`)}
   if(W.tw>=9&&Math.random()<.55){win=w;add("nex",w,`${N[w]}, Nexus’u yıkarak kazandı!`)}}
  T.forEach(m=>m.buff--);
  frames.push({t,k:T.map(m=>m.kills),g:T.map(m=>m.gold),tw:T.map(m=>m.tw),dr:T.map(m=>m.dr),bar:T.map(m=>m.bar),inh:T.map(m=>m.inh),u:T.map(m=>m.u.map(x=>({k:x.k,d:x.d,a:x.a,g:x.g})))})}
 if(win===null){win=T[0].tw>T[1].tw?0:T[1].tw>T[0].tw?1:rnd(2);ev.push({s:t*60,type:"nex",team:win,txt:`Süre doldu, ${N[win]} kule üstünlüğüyle kazandı.`})}
 return{T,frames,ev,dl,win,end:t}}

function teamP(n,l,m,c){return `<div class="p"><b class="${c}">${n}</b><span style="float:right">Kalan <b>$${m}</b></span>`+
 [0,1,2,3,4].map(i=>{const x=l[i];return `<div class="slot">${x?tile(x)+`<div><b>${x.n}</b><small>${R[x.r]}</small></div>`:`<span style="color:var(--m)">Boş slot</span>`}</div>`}).join("")+`</div>`}
function draft(){
 const mine=G.phase=="pick"&&G.win=="you",me=G.phase=="bid"&&G.turn=="you";
 return `<h1>Şampiyon Müzayedesi</h1><div class="row">${teamP("SEN",G.y,G.my,"you")}<div>
 <div class="p"><b>Tur ${G.round}</b> · ${G.y.length+G.b.length}/10 şampiyon seçildi
 ${G.phase=="bid"?`<div class="big">$${G.bid}</div><div>${G.last?(G.last=="you"?"Son teklif senin":"Son teklif rakibin"):"Henüz teklif yok"}. ${me?"Sıra sende:":"Rakip düşünüyor…"}</div>
 <div class="bar">${[10,50,100].map(n=>`<button ${me&&G.bid+n<=cap()?"":"disabled"} onclick="bid(${n})">+$${n}</button>`).join("")}<button ${me?"":"disabled"} onclick="end('bot')">Pas</button></div>`:""}
 <div style="margin-top:6px;color:var(--g)">${G.msg}</div></div>
 <div class="grid">${G.pack.map((c,i)=>`<div class="card ${mine?"pk":""}" ${mine?`tabindex=0 onclick="pk(${i})" onkeydown="if(event.key=='Enter')pk(${i})"`:""}>${tile(c)}<b>${c.n}</b><small>${R[c.r]}</small></div>`).join("")}</div>
 </div>${teamP("RAKİP",G.b,G.mb,"bot")}</div>`}
function lanesH(){
 const side=(l,r,mine)=>`<div class="p"><b class="${mine?"you":"bot"}">${mine?"SEN":"RAKİP"}</b>`+l.map((c,i)=>`<div class="slot">${tile(c)}<div style="flex:1"><b>${c.n}</b><small>Doğal rol: ${R[c.r]}</small></div>${mine?`<select aria-label="${c.n} koridoru" onchange="setLane(${i},this.value)">${LN.map(k=>`<option value="${k}" ${k==r[i]?"selected":""}>${R[k]}</option>`).join("")}</select>`:`<span>${R[r[i]]}</span>`}</div>`).join("")+`</div>`;
 const ok=new Set(G.ly).size==5;
 return `<h1>Son takım hazırlığı</h1><p>Koridorları ayarla. Rolü doğal koridorunda olmayan şampiyon %20 güç kaybeder.</p><div class="two">${side(G.y,G.ly,1)}${side(G.b,G.lb,0)}</div>
 <div class="bar">${ok?"":`<span class="bot">Her koridor bir kez seçilmeli.</span>`}<button class="main" ${ok?"":"disabled"} onclick="startSim()">Maçı başlat</button></div>`}
function board(i,f){const T=G.sim.T[i];return `<div class="p"><b class="${i?"bot":"you"}">${N[i]}</b><table><tr><th>Şampiyon<th>K<th>D<th>A<th>Altın</tr>`+
 T.u.map((x,j)=>{const s=f.u[i][j];return `<tr><td>${x.c.n}<small style="color:var(--m)"> ${R[x.lane]}</small><td>${s.k}<td>${s.d}<td>${s.a}<td>${(s.g/1000).toFixed(1)}K</tr>`}).join("")+`</table></div>`}
function simH(){
 const S=G.sim,f=S.frames[G.fi],done=G.fi==S.frames.length-1,box=i=>`<div class="stats"><div>Ejder<b>${f.dr[i]}</b></div><div>Baron<b>${f.bar[i]}</b></div><div>Kule<b>${f.tw[i]}</b></div><div>İnhibitör<b>${f.inh[i]}/3</b></div></div>`;
 const evs=S.ev.filter(e=>e.s<=f.t*60||done).reverse();
 return `<h1>Canlı simülasyon</h1><div class="p" style="text-align:center"><span class="big you">${f.k[0]}</span> <span style="margin:0 14px">${fmt(done?S.end*60:f.t*60)}</span> <span class="big bot">${f.k[1]}</span>
 <div style="color:var(--m)">Takım altını: ${(f.g[0]/1000).toFixed(1)}K · ${(f.g[1]/1000).toFixed(1)}K</div></div>
 <div class="two">${box(0)}${box(1)}</div><div class="two">${board(0,f)}${board(1,f)}</div>
 <div class="p" style="margin-top:10px"><b>Maç olayları</b><div class="log">${evs.map(e=>`<div><b>${fmt(e.s)}</b><span class="${e.team?"bot":"you"}">${e.txt}</span></div>`).join("")||"Maç başladı…"}</div></div>
 <div class="bar">${done?`<button class="main" onclick="analysis()">Maç analizini gör</button>`:`<button onclick="faster()">Hız: ${G.spd==450?"×1":"×3"}</button><button onclick="skip()">Sonuca atla</button>`}</div>`}
function analysisH(){
 const S=G.sim,W=S.win,L=1-W,TW=S.T[W],TL=S.T[L],kd=TW.kills-TL.kills;
 const e=S.ev.find(x=>x.team==W&&x.type=="inh")||S.ev.find(x=>x.team==W&&x.type=="bar")||S.ev.find(x=>x.team==W&&x.type=="dr");
 const gd=TW.gold-TL.gold,n4=S.dl.filter(x=>x.team==L&&x.t>S.end-4).length;
 const all=[...S.T[0].u.map(x=>({...x,tm:0})),...S.T[1].u.map(x=>({...x,tm:1}))],mv=all.reduce((a,x)=>(x.k*2+x.a-x.d*1.5+x.dmg/5000)>(a.k*2+a.a-a.d*1.5+a.dmg/5000)?x:a);
 const card=(h,t)=>`<div class="p"><h3>${h}</h3>${t}</div>`;
 return `<h1>Maç analizi</h1><div class="two"><div class="p"><b class="you">SEN</b><br>${S.T[0].kills} kill · ${S.T[0].tw} kule</div><div class="p"><b class="bot">RAKİP</b><br>${S.T[1].kills} kill · ${S.T[1].tw} kule</div></div>
 <h2>${N[W]} neden kazandı?</h2><div class="cards">
 ${card("Maçın kararı",`${N[W]}, ${kd>0?kd+" kill avantajıyla":kd<0?-kd+" kill geride olmasına rağmen":"eşit killle"} maçı ${S.end}. dakikada bitirdi. Skor ${TW.kills}–${TL.kills}. Maçı kill sayısı değil, kule ve Nexus baskısı belirledi.`)}
 ${card("Kritik kırılma anı",e?`${fmt(e.s)}: ${e.txt} Objektif yarışında öne geçilen ve maçın yönünün netleştiği an bu oldu.`:"Net bir kırılma anı yok, maç küçük farklarla ilerledi.")}
 ${card("Ekonomi ve geri dönüş",`Toplam kazanılan altın farkı ${Math.abs(gd).toLocaleString("tr-TR")}, ${gd>=0?`${N[W]} lehine`:`${N[L]} lehine`}. ${gd>=0?"Altın üstünlüğü objektif baskısını destekledi.":"Altın geride olsa da objektifler öne geçirdi."}`)}
 ${card("Objektif ve baskı",`Ejder ${TW.dr}–${TL.dr}, Baron ${TW.bar}–${TL.bar}, yıkılan kule ${TW.tw}–${TL.tw} (kazanan–kaybeden), inhibitör ${TW.inh}–${TL.inh}.`)}
 ${card("Kaybedenin son savunması",`Son 4 dakikada ${N[L]} ${n4} kez düştü. ${n4>=3?"Final savunmasında oyuncu kaybı Nexus hattının korunmasını imkânsız kıldı.":"Savunma tamamen çökmedi ama kule hattı tutulamadı."}`)}
 ${card("Maçın MVP’si",`${mv.c.n} (${N[mv.tm]}): ${mv.k}/${mv.d}/${mv.a} KDA, ${mv.dmg.toLocaleString("tr-TR")} hasar.`)}
 </div><h2>Kritik anlar</h2><div class="p log" style="max-height:300px">${S.ev.map(x=>`<div><b>${fmt(x.s)}</b><span class="${x.team?"bot":"you"}">${x.txt}</span></div>`).join("")}</div>
 <div class="bar"><button onclick="G.screen='sim';render()">Skor tablosuna dön</button><button class="main" onclick="newGame()">Yeni oyun</button></div>`}
function render(){app.innerHTML={draft,lanes:lanesH,sim:simH,analysis:analysisH}[G.screen]()}
newGame();
</script></body></html>
